```yaml
# GitHub Pages deployment for tamil_events

name: Deploy Jekyll with GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # =========================
  # BUILD
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Make sure the wedding planner files are included
      - name: Check website files
        run: |
          echo "Checking website files..."

          test -f ./_site/index.html
          test -f ./_site/style.css
          test -f ./_site/script.js

          echo "✓ index.html"
          echo "✓ style.css"
          echo "✓ script.js"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site


  # =========================
  # DEPLOY
  # =========================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```
